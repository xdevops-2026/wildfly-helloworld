name: CI - Build WildFly

on:
  push:
    branches: [ develop ]
    paths:
      - 'pom.xml'
      - 'src/**'
      - 'Containerfile'
      - 'Dockerfile'
      - '.github/workflows/ci-develop-wildfly-maven.yaml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  JAVA_VERSION: 17

jobs:
  build-app:
    name: Build & test Maven project
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.versioning.outputs.version }}
      image_tag: ${{ steps.versioning.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run Maven verify (with tests)
        run: mvn -B -ntp verify

      - name: Compute version and image tag
        id: versioning
        run: |
          PROJECT_VERSION=$(mvn -q -DforceStdout -Dexpression=project.version -ntp help:evaluate | tail -1)
          PROJECT_VERSION=${PROJECT_VERSION:-0.0.0}
          CLEAN_VERSION=$(echo "$PROJECT_VERSION" | sed 's/-SNAPSHOT$//')
          SHORT_SHA=${GITHUB_SHA::7}
          BUILD_NUMBER=${GITHUB_RUN_NUMBER:-0}
          IMAGE_TAG="${CLEAN_VERSION}-${SHORT_SHA}-${BUILD_NUMBER}"
          echo "version=$CLEAN_VERSION" >> $GITHUB_OUTPUT
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Prepare WAR artifact
        run: |
          FINAL_NAME=$(mvn -q -DforceStdout -Dexpression=project.build.finalName -ntp help:evaluate | tail -1)
          FINAL_NAME=${FINAL_NAME:-app}
          SRC_WAR="target/${FINAL_NAME}.war"
          if [ ! -f "$SRC_WAR" ]; then
            echo "WAR not found: $SRC_WAR" >&2
            exit 1
          fi
          mkdir -p target
          cp "$SRC_WAR" target/app.war

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: wildfly-war
          path: target/app.war
          retention-days: 7

  build-image:
    name: Build and push container image
    runs-on: ubuntu-latest
    needs: build-app
    env:
      IMAGE_TAG: ${{ needs.build-app.outputs.image_tag }}
      VERSION: ${{ needs.build-app.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: wildfly-war
          path: target

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: containerfiles/wildfly.Containerfile
          push: true
          platforms: linux/amd64
          build-args: |
            APP_ARTIFACT=target/app.war
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:develop
          labels: |
            org.opencontainers.image.version=${{ env.IMAGE_TAG }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
