name: CI - Build WildFly

on:
  push:
    branches: [ develop ]
    paths:
      - 'pom.xml'
      - 'src/**'
      - 'Containerfile'
      - 'Dockerfile'
      - '.github/workflows/ci-develop-wildfly-maven.yaml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  JAVA_VERSION: 17

jobs:
  build-app:
    name: Build & Test Maven project
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.versioning.outputs.version }}
      image_tag: ${{ steps.versioning.outputs.image_tag }}
      artifact_version: ${{ steps.versioning.outputs.artifact_version }}
      artifact_path: ${{ steps.artifact.outputs.artifact_path }}
      artifact_base: ${{ steps.artifact.outputs.artifact_base }}
    steps:
      - uses: actions/checkout@v4
      - name: Secret scan with TruffleHog (repo tree)
        uses: trufflesecurity/trufflehog@v3.92.4
        with:
          path: .
          extra_args: --only-verified

      - name: CVE scan with Trivy (filesystem)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
          vuln-type: os,library

      - name: Upload CVE scan report
        uses: actions/upload-artifact@v4
        with:
          name: cve-report
          path: trivy-results.sarif
          if-no-files-found: error
          retention-days: 7

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run Maven verify (with tests)
        run: mvn -B -ntp verify

      - name: Compute version and image tag
        id: versioning
        run: |
          PROJECT_VERSION=$(mvn -q -DforceStdout -Dexpression=project.version -ntp help:evaluate | tail -1)
          PROJECT_VERSION=${PROJECT_VERSION:-0.0.0-SNAPSHOT}
          CLEAN_VERSION=$(echo "$PROJECT_VERSION" | sed 's/-SNAPSHOT$//')
          SHORT_SHA=${GITHUB_SHA::7}
          BUILD_NUMBER=${GITHUB_RUN_NUMBER:-0}
          VERSION_TAG="${CLEAN_VERSION}-${SHORT_SHA}-b${BUILD_NUMBER}"
          echo "version=$VERSION_TAG" >> $GITHUB_OUTPUT
          echo "artifact_version=$VERSION_TAG" >> $GITHUB_OUTPUT
          echo "image_tag=$VERSION_TAG" >> $GITHUB_OUTPUT

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: Prepare WAR artifact
        id: artifact
        run: |
          FINAL_NAME=$(mvn -q -DforceStdout -Dexpression=project.build.finalName -ntp help:evaluate | tail -1)
          FINAL_NAME=${FINAL_NAME:-app}
          SRC_WAR="target/${FINAL_NAME}.war"
          DEST_WAR="target/app.war"
          if [ ! -f "$SRC_WAR" ]; then
            echo "WAR not found: $SRC_WAR" >&2
            exit 1
          fi
          if [ "$SRC_WAR" != "$DEST_WAR" ]; then
            mkdir -p "$(dirname "$DEST_WAR")"
            cp "$SRC_WAR" "$DEST_WAR"
          fi
          echo "artifact_path=$DEST_WAR" >> $GITHUB_OUTPUT
          echo "artifact_base=$FINAL_NAME" >> $GITHUB_OUTPUT

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.artifact_base }}-war-${{ steps.versioning.outputs.artifact_version }}
          path: ${{ steps.artifact.outputs.artifact_path }}
          retention-days: 7

      - name: Publish WAR to artifact repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_REPO_ID: ${{ vars.ARTIFACT_REPO_ID }}
          ARTIFACT_REPO_URL: ${{ vars.ARTIFACT_REPO_URL }}
          ARTIFACT_REPO_USERNAME: ${{ secrets.ARTIFACT_REPO_USERNAME }}
          ARTIFACT_REPO_PASSWORD: ${{ secrets.ARTIFACT_REPO_PASSWORD }}
        run: |
          set -euo pipefail
          REPO_ID=${ARTIFACT_REPO_ID:-github}
          REPO_URL=${ARTIFACT_REPO_URL:-https://maven.pkg.github.com/${GITHUB_REPOSITORY}}
          REPO_USERNAME=${ARTIFACT_REPO_USERNAME:-${GITHUB_ACTOR}}
          REPO_PASSWORD=${ARTIFACT_REPO_PASSWORD:-${GITHUB_TOKEN}}
          mvn -B -ntp deploy -DskipTests \
            -DaltDeploymentRepository="${REPO_ID}::default::${REPO_URL}" \
            -Dusername="${REPO_USERNAME}" \
            -Dpassword="${REPO_PASSWORD}"

  build-image:
    name: Build and push container image
    runs-on: ubuntu-latest
    needs: build-app
    env:
      IMAGE_TAG: ${{ needs.build-app.outputs.image_tag }}
      IMAGE_NAME: ${{ github.repository_owner }}/${{ needs.build-app.outputs.artifact_base }}
    steps:
      - uses: actions/checkout@v4

      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-app.outputs.artifact_base }}-war-${{ needs.build-app.outputs.artifact_version }}
          path: target

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (load for scanning)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Containerfile
          push: false
          load: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:develop
          labels: |
            org.opencontainers.image.version=${{ env.IMAGE_TAG }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image scan with Trivy
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: image
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: sarif
          output: trivy-image.sarif
          ignore-unfixed: true
          vuln-type: os,library

      - name: Upload image scan report
        uses: actions/upload-artifact@v4
        with:
          name: image-cve-report
          path: trivy-image.sarif
          if-no-files-found: error
          retention-days: 7

      - name: Push image tags
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:develop

      - name: Get pushed image digest (version tag)
        id: image_digest
        env:
          IMAGE_VERSION_TAG: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
        run: |
          set -euo pipefail
          REPO_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE_VERSION_TAG}" 2>/dev/null || true)
          if [ -z "$REPO_DIGEST" ]; then
            echo "Failed to retrieve RepoDigests for ${IMAGE_VERSION_TAG}" >&2
            exit 1
          fi
          DIGEST=${REPO_DIGEST#*@}
          if [ -z "$DIGEST" ] || [[ "$DIGEST" != sha256:* ]]; then
            echo "Failed to parse digest from ${REPO_DIGEST}" >&2
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Generate and push provenance attestation (version tag)
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          subject-digest: ${{ steps.image_digest.outputs.digest }}
          push-to-registry: true
